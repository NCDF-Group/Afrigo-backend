databases:
  - name: afrigo-db
    databaseName: afrigo
    user: afrigo
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"

services:
  - type: web
    name: afrigo-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: afrigo-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: ADMIN_APP_URL
        sync: false
      - key: EMAIL_FROM
        value: AfriGoOS <no-reply@afrigo.africa>
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
